substitutions:
  device_name: "weact-display"
  display_refresh_interval: "60s"

esphome:
  name: ${device_name}
  friendly_name: WeAct E-ink Display

esp8266:
  board: nodemcuv2
  framework:
    version: recommended

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.2.211
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1

ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

font:
  - file: "gfonts://Roboto"
    id: font_main
    size: 20

display:
  - platform: epaper_spi
    id: eink_display
    model: weact-2.13in-3c
    cs_pin: GPIO15
    dc_pin: GPIO4
    busy_pin: GPIO16
    reset_pin: GPIO5
    rotation: 90
    update_interval: ${display_refresh_interval}
    lambda: |-
      it.print(10, 10, id(font_main), Color::BLACK, "Hola mundo!");

# La integración con Home Assistant (fase 8) se añade en una fase posterior
# (ver docs/superpowers/specs/2026-09-17-esphome-weact-display-design.md).
