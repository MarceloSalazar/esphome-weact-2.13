substitutions:
  device_name: "weact-display"
  display_refresh_interval: "5min"

esphome:
  name: ${device_name}
  friendly_name: WeAct E-ink Display

esp8266:
  board: nodemcuv2
  framework:
    version: recommended

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.2.211
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1

ota:
  - platform: esphome
    encryption:

api:
  encryption:
    key: !secret api_encryption_key

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: homeassistant
    id: battery_soc
    entity_id: sensor.victron_system_battery_soc
  - platform: homeassistant
    id: battery_voltage
    entity_id: sensor.victron_system_battery_voltage
  - platform: homeassistant
    id: battery_power_avg
    entity_id: sensor.garage_settings_battery_power_avg_5min
  - platform: homeassistant
    id: house_consumption_avg
    entity_id: sensor.entrance_shellyem_c45bbee19932_channel_1_consumo_vivienda_avg_5min

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

font:
  - file: "gfonts://Roboto"
    id: font_main
    size: 20

display:
  - platform: epaper_spi
    id: eink_display
    model: weact-2.13in-3c
    cs_pin: GPIO15
    dc_pin: GPIO4
    busy_pin: GPIO16
    reset_pin: GPIO5
    rotation: 90
    update_interval: ${display_refresh_interval}
    lambda: |-
      it.print(4, 6, id(font_main), Color::BLACK,
               id(ha_time).now().strftime("Fecha: %d/%m/%Y - Hora: %H:%M").c_str());
      it.printf(4, 46, id(font_main), Color::BLACK, "Bateria: %.0f%% / %.1fV / %+.0fW",
                id(battery_soc).state, id(battery_voltage).state, id(battery_power_avg).state);
      it.printf(4, 86, id(font_main), Color::BLACK, "Consumo vivienda: %.0fW",
                id(house_consumption_avg).state);
